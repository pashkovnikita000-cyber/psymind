<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#6C63FF" />
    <title>PsyMind — Психологические тесты</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"><div id="dbg" style="padding:20px;color:#333;background:#ffe066;min-height:100vh;font-family:sans-serif;font-size:16px">⏳ Loading...</div></div>
    <script>
      var dbg = document.getElementById('dbg');
      dbg.textContent = '1/3 inline OK';

      window.onerror = function(msg, src, line, col, err) {
        dbg.style.background = '#c0392b';
        dbg.style.color = '#fff';
        dbg.textContent = 'JS ERROR: ' + msg + '\n' + (err ? err.stack : '') + '\nSrc:' + src + ':' + line;
      };
      window.addEventListener('unhandledrejection', function(e) {
        dbg.style.background = '#c0392b';
        dbg.style.color = '#fff';
        dbg.textContent = 'PROMISE ERROR: ' + String(e.reason && e.reason.stack ? e.reason.stack : e.reason);
      });

      setTimeout(function() {
        if (document.getElementById('dbg')) {
          dbg.style.background = '#e67e22';
          dbg.textContent = '3/3 TIMEOUT — module script did not run after 8s. No JS errors caught.';
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
